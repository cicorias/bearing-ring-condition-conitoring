[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grinder-diagnostics-model"
version = "0.1.0"
description = "Two-stage random-forest inference for bearing-ring grinder faults"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "joblib>=1.5.3",
  "nptdms>=1.11.0",
  "numpy>=2.5.2",
  "pandas>=3.0.5",
  "pyarrow>=25.0.1",
  "pydantic-settings>=2.15.0",
  "scikit-learn>=1.9.0",
  "scipy>=1.18.0",
  "torch>=2.13.0",
  "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.3",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]
grinder-model-data-check = "grinder_diagnostics_model.cli:data_check"
grinder-model-build-features = "grinder_diagnostics_model.cli:build_features"
grinder-model-train = "grinder_diagnostics_model.cli:train"
grinder-model-predict = "grinder_diagnostics_model.cli:predict"
grinder-model-sample-client = "grinder_diagnostics_model.cli:sample_client"

[tool.hatch.build.targets.wheel]
packages = ["src/grinder_diagnostics_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
